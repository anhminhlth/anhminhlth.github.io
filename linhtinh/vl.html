      let currentTab = 'characters';
      let currentFactionFilter = 'ALL';
      let searchQuery = '';
      let disputeChartInstance = null;

      function switchTab(tabId) {
        currentTab = tabId;
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.remove('tab-active');
          btn.classList.add('bg-[#F8F9FA]', 'text-[#666666]');
        });
        const activeBtn = document.getElementById(`tab-btn-${tabId}`);
        if (activeBtn) {
          activeBtn.classList.add('tab-active');
          activeBtn.classList.remove('bg-[#F8F9FA]', 'text-[#666666]');
        }

        document.querySelectorAll('.tab-view').forEach(view => view.classList.add('hidden'));
        const activeView = document.getElementById(`tab-content-${tabId}`);
        if (activeView) activeView.classList.remove('hidden');

        const filterBar = document.getElementById('filter-bar-container');
        const charFilters = document.getElementById('character-filters');
        if (tabId === 'update' || tabId === 'court') {
          filterBar.classList.add('hidden');
        } else {
          filterBar.classList.remove('hidden');
          if (tabId === 'characters') charFilters.classList.remove('hidden');
          else charFilters.classList.add('hidden');
        }

        if (tabId === 'court') {
          renderDisputeChart();
        }
        renderActiveTab();
      }

      function filterFaction(faction) {
        currentFactionFilter = faction;
        document.querySelectorAll('.faction-filter-btn').forEach(btn => {
          if (btn.getAttribute('data-f') === faction) {
            btn.className = "faction-filter-btn filter-active px-2 py-1 rounded border border-[#D1D1D1] font-medium";
          } else {
            btn.className = "faction-filter-btn px-2 py-1 rounded bg-[#FFFFFF] border border-[#D1D1D1] text-[#666666]";
          }
        });
        renderCharacters();
      }

      function handleSearch(val) {
        searchQuery = val.trim().toLowerCase();
        const clearBtn = document.getElementById('clear-search');
        if (searchQuery.length > 0) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
        renderActiveTab();
      }

      function clearSearch() {
        document.getElementById('search-input').value = '';
        searchQuery = '';
        document.getElementById('clear-search').classList.add('hidden');
        renderActiveTab();
      }

      function renderActiveTab() {
        if (currentTab === 'characters') renderCharacters();
        else if (currentTab === 'timeline') renderTimeline();
        else if (currentTab === 'slang') renderSlangs();
        else if (currentTab === 'psychology') renderPsychology();
        else if (currentTab === 'court') renderAssets();
      }

      // Render Tab 1: Characters (Compact & Concise)
      function renderCharacters() {
        const list = document.getElementById('character-list');
        list.innerHTML = '';
        const filtered = DRAMA_DATA.characters.filter(c => {
          const matchF = (currentFactionFilter === 'ALL') || (c.faction === currentFactionFilter);
          const matchS = searchQuery === '' ||
            c.name.toLowerCase().includes(searchQuery) ||
            c.alias.toLowerCase().includes(searchQuery) ||
            c.past.toLowerCase().includes(searchQuery) ||
            c.now.toLowerCase().includes(searchQuery) ||
            c.point.toLowerCase().includes(searchQuery);
          return matchF && matchS;
        });

        if (filtered.length === 0) {
          list.innerHTML = '<div class="col-span-full py-6 text-center text-xs text-[#666666]">Không tìm thấy nhân vật khớp từ khóa.</div>';
          return;
        }

        filtered.forEach(c => {
          const card = document.createElement('div');
          card.className = "p-3 rounded-lg bg-[#F8F9FA] border border-[#D1D1D1] flex flex-col justify-between text-xs gap-2";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-1.5 border-b border-[#D1D1D1] pb-1.5">
              <div>
                <h4 class="font-heading font-bold text-[13px] text-[#111111]">${c.name}</h4>
                <span class="text-[11px] text-[#666666]">${c.alias}</span>
              </div>
              <span class="px-2 py-0.5 rounded text-[10px] font-semibold shrink-0 ${c.badge_cls}">${c.badge}</span>
            </div>
            <ul class="space-y-1 text-[11px] leading-relaxed text-[#666666] list-disc pl-4">
              <li><b class="text-[#111111]">Quá khứ:</b> ${c.past}</li>
              <li><b class="text-[#1A73E8]">Hiện tại (2026):</b> ${c.now}</li>
              <li><b class="text-[#111111]">Bản chất:</b> ${c.point}</li>
            </ul>
          `;
          list.appendChild(card);
        });
      }

      // Render Tab 2: Vertical Timeline
      function renderTimeline() {
        const list = document.getElementById('timeline-list');
        list.innerHTML = '';
        const filtered = DRAMA_DATA.timeline.filter(t =>
          searchQuery === '' ||
          t.date.toLowerCase().includes(searchQuery) ||
          t.title.toLowerCase().includes(searchQuery) ||
          t.desc.toLowerCase().includes(searchQuery)
        );

        if (filtered.length === 0) {
          list.innerHTML = '<div class="py-6 text-center text-xs text-[#666666]">Không có mốc thời gian nào khớp từ khóa.</div>';
          return;
        }

        filtered.forEach(t => {
          const item = document.createElement('div');
          item.className = "relative";
          item.innerHTML = `
            <div class="absolute -left-[21px] top-1.5 w-2.5 h-2.5 rounded-full bg-[#1A73E8] border-2 border-[#FFFFFF]"></div>
            <div class="bg-[#F8F9FA] p-2.5 rounded-lg border border-[#D1D1D1] text-xs">
              <div class="flex flex-wrap items-center justify-between gap-1 mb-1">
                <span class="font-heading font-bold text-[#111111] text-xs">${t.date} — ${t.title}</span>
                <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-[#FFFFFF] border border-[#D1D1D1] text-[#111111]">${t.tag}</span>
              </div>
              <p class="text-[11px] text-[#666666] leading-relaxed">${t.desc}</p>
            </div>
          `;
          list.appendChild(item);
        });
      }

      // Render Tab 3: Slangs & Le Tin Analysis
      function renderSlangs() {
        const list = document.getElementById('slang-list');
        list.innerHTML = '';
        const filtered = DRAMA_DATA.slangs.filter(s =>
          searchQuery === '' ||
          s.term.toLowerCase().includes(searchQuery) ||
          s.summary.toLowerCase().includes(searchQuery) ||
          s.bullets.join(' ').toLowerCase().includes(searchQuery)
        );

        if (filtered.length === 0) {
          list.innerHTML = '<div class="py-6 text-center text-xs text-[#666666]">Không tìm thấy mục giải mã phù hợp.</div>';
          return;
        }

        filtered.forEach(s => {
          const card = document.createElement('div');
          card.className = "p-3 bg-[#F8F9FA] rounded-lg border border-[#D1D1D1] flex flex-col gap-1.5 text-xs";
          const bulletHtml = s.bullets.map(b => `<li>${b}</li>`).join('');
          card.innerHTML = `
            <div class="flex flex-wrap items-center justify-between gap-1 border-b border-[#D1D1D1] pb-1">
              <span class="font-heading font-bold text-xs sm:text-[13px] text-[#D93025]">${s.term}</span>
              <span class="text-[11px] text-[#666666] italic">${s.summary}</span>
            </div>
            <ul class="list-disc pl-4 space-y-1 text-[11px] text-[#111111] leading-relaxed">
              ${bulletHtml}
            </ul>
          `;
          list.appendChild(card);
        });
      }

      // Render Tab 4: Psychology
      function renderPsychology() {
        const list = document.getElementById('psychology-list');
        list.innerHTML = '';
        const filtered = DRAMA_DATA.psychology.filter(p =>
          searchQuery === '' ||
          p.character.toLowerCase().includes(searchQuery) ||
          p.motive.toLowerCase().includes(searchQuery) ||
          p.p1.toLowerCase().includes(searchQuery) ||
          p.p2.toLowerCase().includes(searchQuery) ||
          p.p3.toLowerCase().includes(searchQuery)
        );

        filtered.forEach(p => {
          const card = document.createElement('div');
          card.className = "p-3 bg-[#F8F9FA] rounded-lg border border-[#D1D1D1] flex flex-col gap-2 text-xs";
          card.innerHTML = `
            <div class="flex flex-wrap items-center justify-between gap-1 border-b border-[#D1D1D1] pb-1.5">
              <h4 class="font-heading font-bold text-xs sm:text-[13px] text-[#111111]">${p.character}</h4>
              <span class="text-[11px] text-[#1A73E8] font-medium">Động cơ: ${p.motive}</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-[11px]">
              <div class="p-2 bg-[#FFFFFF] rounded border border-[#D1D1D1] text-[#666666] leading-relaxed">${p.p1}</div>
              <div class="p-2 bg-[#FFFFFF] rounded border border-[#D1D1D1] text-[#666666] leading-relaxed">${p.p2}</div>
              <div class="p-2 bg-[#FFFFFF] rounded border border-[#D1D1D1] text-[#111111] font-medium leading-relaxed">${p.p3}</div>
            </div>
          `;
          list.appendChild(card);
        });
      }

      // Render Tab 5: Assets
      function renderAssets() {
        const list = document.getElementById('assets-breakdown');
        list.innerHTML = '';
        DRAMA_DATA.court_assets.forEach(a => {
          const card = document.createElement('div');
          card.className = "p-2.5 bg-[#F8F9FA] rounded-lg border border-[#D1D1D1] flex flex-col justify-between gap-1 text-xs";
          card.innerHTML = `
            <div class="flex items-center justify-between gap-1">
              <span class="font-heading font-bold text-[#111111] text-xs">${a.item}</span>
              <span class="px-1.5 py-0.5 rounded bg-[#FFFFFF] border border-[#D1D1D1] font-semibold text-[#1A73E8] text-[10px] shrink-0">${a.val}</span>
            </div>
            <p class="text-[11px] text-[#666666] leading-relaxed">${a.desc}</p>
          `;
          list.appendChild(card);
        });
      }

      // Chart.js Implementation
      function renderDisputeChart() {
        const ctx = document.getElementById('disputeChart');
        if (!ctx) return;
        if (disputeChartInstance) disputeChartInstance.destroy();

        disputeChartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: [
              'Sơ thẩm (07/01/2025)',
              'Kháng cáo Hồng Loan',
              'Kháng cáo Cô Sáu (PA1)'
            ],
            datasets: [
              {
                label: 'Hồng Loan (%)',
                data: [85, 100, 50],
                backgroundColor: '#1A73E8',
                borderRadius: 4
              },
              {
                label: 'Cô Sáu & Chú Bảy (%)',
                data: [15, 0, 50],
                backgroundColor: '#D93025',
                borderRadius: 4
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: 'y',
            scales: {
              x: {
                stacked: true,
                max: 100,
                border: { display: false },
                grid: { color: '#D1D1D1' },
                ticks: {
                  color: '#888888',
                  font: { family: "'Google Sans Text', sans-serif", size: 11 },
                  callback: (val) => val + '%'
                }
              },
              y: {
                stacked: true,
                border: { display: false },
                grid: { display: false },
                ticks: {
                  color: '#111111',
                  font: { family: "'Google Sans', sans-serif", size: 11 }
                }
              }
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: '#FFFFFF',
                titleColor: '#111111',
                bodyColor: '#666666',
                borderColor: '#D1D1D1',
                borderWidth: 1,
                callbacks: {
                  label: function(context) {
                    if (context.dataIndex === 1 && context.datasetIndex === 0) {
                      return ' Hồng Loan: 100% (+ Đề nghị hỗ trợ 2 tỷ đ)';
                    }
                    return ` ${context.dataset.label}: ${context.raw}%`;
                  }
                }
              },
              datalabels: {
                color: '#FFFFFF',
                font: { family: "'Google Sans', sans-serif", size: 11, weight: 'bold' },
                formatter: (val, ctx) => {
                  if (val === 0) return '';
                  if (ctx.dataIndex === 1 && ctx.datasetIndex === 0) return '100% (+2 tỷ)';
                  return val + '%';
                }
              }
            }
          },
          plugins: [ChartDataLabels]
        });
      }

      // Utility: Copy Prompt for Future Update
      function copyUpdatePrompt() {
        const promptText = document.getElementById('update-prompt-text').innerText;
        navigator.clipboard.writeText(promptText).then(() => {
          const btn = document.getElementById('btn-copy-prompt');
          const oldHtml = btn.innerHTML;
          btn.innerHTML = '<span>✓ Đã Copy Câu Lệnh!</span>';
          setTimeout(() => { btn.innerHTML = oldHtml; }, 2000);
        });
      }

      // Utility: Copy Full Standalone HTML Source Code
      function copyFullHtmlPage() {
        const fullHtml = '<!doctype html>\n' + document.documentElement.outerHTML;
        navigator.clipboard.writeText(fullHtml).then(() => {
          const btn = document.getElementById('btn-copy-html-top');
          const oldHtml = btn.innerHTML;
          btn.innerHTML = '<span>✓ Đã Copy Code HTML!</span>';
          setTimeout(() => { btn.innerHTML = oldHtml; }, 2000);
        });
      }

      // Utility: Download Standalone .HTML File
      function downloadHtmlFile() {
        const fullHtml = '<!doctype html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cam-nang-vu-linh-2026.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      document.fonts.ready.then(() => {
        renderCharacters();
        renderTimeline();
        renderSlangs();
        renderPsychology();
        renderAssets();
      });
    </script>
