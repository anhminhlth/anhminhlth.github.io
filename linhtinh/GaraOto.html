  <script>
    let costChartInstance = null;

    function initOrRenderCostChart() {
      const canvas = document.getElementById('costBreakdownChart');
      if (!canvas) return;
      if (costChartInstance) {
        costChartInstance.resize();
        return;
      }
      Chart.register(ChartDataLabels);
      Chart.defaults.font.family = "'Google Sans', 'Google Sans Text', sans-serif";
      Chart.defaults.color = '#111111';

      const ctx = canvas.getContext('2d');
      costChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: [
            ['Sơn 4–5 mặt', '(Gộp 1 vụ PTI)'],
            ['Sơn nhiều mặt', '(Tách 2 vụ PTI)'],
            ['Đánh bóng', 'kính lái'],
            ['Đánh bóng', '2 kính sườn'],
            ['COMBO TỔNG', '(Sơn + Kính lái)']
          ],
          datasets: [
            {
              label: 'PTI Bảo lãnh trả (Triệu đ)',
              data: [4.5, 7.0, 0, 0, 4.5],
              backgroundColor: '#1A73E8',
              borderRadius: 4,
              barPercentage: 0.72
            },
            {
              label: 'Bạn thực trả (Triệu đ)',
              data: [0.5, 1.0, 0.8, 0.6, 1.3],
              backgroundColor: '#FA903E',
              borderRadius: 4,
              barPercentage: 0.72
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 20, right: 10, left: 0, bottom: 0 } },
          scales: {
            x: {
              grid: { display: false, drawBorder: false },
              ticks: { color: '#111111', font: { size: 11, weight: '500' } }
            },
            y: {
              beginAtZero: true,
              grace: '18%',
              border: { display: false },
              grid: { color: '#D1D1D1', drawBorder: false },
              ticks: {
                color: '#666666',
                font: { size: 11 },
                callback: (val) => val + ' tr'
              }
            }
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#FFFFFF',
              titleColor: '#111111',
              bodyColor: '#666666',
              borderColor: '#D1D1D1',
              borderWidth: 1,
              padding: 10,
              callbacks: {
                label: (c) => `${c.dataset.label}: ${(c.raw * 1000000).toLocaleString('vi-VN')} VNĐ`
              }
            },
            datalabels: {
              anchor: 'end',
              align: 'top',
              offset: 2,
              color: '#111111',
              font: { size: 10, weight: 'bold' },
              formatter: (val) => val === 0 ? '' : val.toLocaleString('vi-VN') + 'tr'
            }
          }
        }
      });
    }

    // Xử lý chuyển Tab chính
    document.querySelectorAll('.main-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.main-tab-btn').forEach(b => {
          b.className = b.className
            .replace('bg-[#1A73E8] text-white font-bold', 'bg-[#FFFFFF] text-[#666666] font-medium')
            .replace('bg-[#1A73E8]', 'bg-[#FFFFFF]')
            .replace('text-white', 'text-[#666666]');
        });
        btn.className = btn.className
          .replace('bg-[#FFFFFF]', 'bg-[#1A73E8]')
          .replace('text-[#666666]', 'text-white')
          .replace('font-medium', 'font-bold');

        const targetId = btn.getAttribute('data-tab');
        document.querySelectorAll('.tab-panel').forEach(panel => {
          if (panel.id === targetId) {
            panel.classList.remove('hidden');
            panel.classList.add('flex');
          } else {
            panel.classList.add('hidden');
            panel.classList.remove('flex');
          }
        });

        if (targetId === 'tab-cost') {
          setTimeout(() => { initOrRenderCostChart(); }, 50);
        }
      });
    });

    // Xử lý lọc Quận trong Tab 2
    document.querySelectorAll('.dir-btn').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.dir-btn').forEach(b => {
          b.className = 'dir-btn px-2 py-1 rounded text-[11px] font-medium bg-[#FFFFFF] text-[#666666] border border-[#D1D1D1]';
        });
        button.className = 'dir-btn px-2 py-1 rounded text-[11px] font-semibold bg-[#1A73E8] text-white';

        const group = button.getAttribute('data-group');
        document.querySelectorAll('.dir-item').forEach(item => {
          const tags = item.getAttribute('data-tags').split(' ');
          item.style.display = (group === 'all' || tags.includes(group)) ? 'flex' : 'none';
        });
      });
    });

    // Đưa mã nguồn HTML vào ô Textarea & Nút Copy trong Tab 5
    document.addEventListener('DOMContentLoaded', () => {
      const sourceBox = document.getElementById('raw-html-source');
      const copyBtn = document.getElementById('copy-html-btn');
      const copyBtnText = document.getElementById('copy-btn-text');

      if (sourceBox) {
        sourceBox.value = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      }

      if (copyBtn && sourceBox) {
        copyBtn.addEventListener('click', () => {
          sourceBox.value = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          sourceBox.select();
          navigator.clipboard.writeText(sourceBox.value).then(() => {
            copyBtnText.textContent = 'Đã Sao Chép Thành Công!';
            setTimeout(() => { copyBtnText.textContent = 'Sao Chép Toàn Bộ Code HTML'; }, 2500);
          });
        });
      }
    });
  </script>
