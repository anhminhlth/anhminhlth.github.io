<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>心理所有权机制、代际被动性与80/90后父母及哈佛幸福研究</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-alabaster: #FAF8F5;
      --card-surface: #FFFFFF;
      --border-warm: #E7E2D8;
      --sage-primary: #2A6F5B;
      --amber-core: #C87D32;
      --terracotta-risk: #C44D3B;
      --ink-primary: #1F2421;
      --ink-secondary: #575D59;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans SC', 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-alabaster);
      color: var(--ink-primary);
      overflow-x: hidden;
      padding-bottom: 96px;
    }

    .font-mono-num { font-family: 'JetBrains Mono', monospace; }

    /* Progressive Scroll-Reveal Discovery */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .scroll-reveal.is-revealed,
    body.reveal-disabled .scroll-reveal {
      opacity: 1;
      transform: translateY(0);
    }

    /* Strictly Contained Diagram Box: Zero Text Overlap Guaranteed */
    .diagram-stage-shell {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      aspect-ratio: 1 / 1;
      max-height: 440px;
      overflow: hidden;
      border-radius: 1rem;
      background: radial-gradient(circle at center, #FFFFFF 0%, #F7F4EE 100%);
      border: 1px solid #E7E2D8;
    }

    .diagram-stage-shell canvas {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 310px;
      max-height: 390px;
      overflow: hidden;
    }
    @media (min-width: 768px) {
      .chart-container { height: 350px; }
    }

    .card-elevated {
      background-color: #FFFFFF;
      border: 1px solid #E7E2D8;
      box-shadow: 0 2px 12px rgba(31, 36, 33, 0.04);
    }

    .nav-pill-active {
      background-color: #2A6F5B;
      color: #FFFFFF !important;
      box-shadow: 0 4px 12px rgba(42, 111, 91, 0.24);
    }

    .step-card-enter {
      animation: slideFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseSpace {
      0%, 100% { box-shadow: 0 0 0 0 rgba(42, 111, 91, 0.45); }
      50% { box-shadow: 0 0 0 8px rgba(42, 111, 91, 0); }
    }

    .space-key-badge { animation: pulseSpace 2.2s infinite; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #F1EDE4; }
    ::-webkit-scrollbar-thumb { background: #B8B2A6; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #2A6F5B; }
  </style>
</head>
<body class="antialiased selection:bg-emerald-100 selection:text-emerald-900">

  <!-- TOP STICKY NAVIGATION HEADER -->
  <header class="sticky top-0 z-40 bg-[#FAF8F5]/95 backdrop-blur-md border-b border-[#E7E2D8]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 flex flex-wrap items-center justify-between gap-2.5">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 shrink-0 rounded-xl bg-[#2A6F5B] text-white flex items-center justify-center font-bold text-lg shadow-sm">
          ◎
        </div>
        <div class="min-w-0">
          <div id="hdrTag" class="text-[11px] font-bold uppercase tracking-wider text-[#2A6F5B] truncate"></div>
          <h1 id="hdrTitle" class="text-xs sm:text-sm md:text-base font-extrabold text-[#1F2421] truncate"></h1>
        </div>
      </div>

      <nav class="hidden xl:flex items-center gap-1 bg-[#F1EDE4] p-1 rounded-xl border border-[#E7E2D8]">
        <button onclick="jumpToSection('sec-model')" class="nav-btn nav-pill-active px-2.5 py-1.5 rounded-lg text-xs font-bold transition" data-target="sec-model" id="navBtn1"></button>
        <button onclick="jumpToSection('sec-parents-harvard')" class="nav-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-[#575D59] hover:text-[#1F2421] transition" data-target="sec-parents-harvard" id="navBtn2"></button>
        <button onclick="jumpToSection('sec-generations')" class="nav-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-[#575D59] hover:text-[#1F2421] transition" data-target="sec-generations" id="navBtn3"></button>
        <button onclick="jumpToSection('sec-empirical')" class="nav-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-[#575D59] hover:text-[#1F2421] transition" data-target="sec-empirical" id="navBtn4"></button>
        <button onclick="jumpToSection('sec-examples')" class="nav-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-[#575D59] hover:text-[#1F2421] transition" data-target="sec-examples" id="navBtn5"></button>
        <button onclick="jumpToSection('sec-protocol')" class="nav-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-[#575D59] hover:text-[#1F2421] transition" data-target="sec-protocol" id="navBtn6"></button>
      </nav>

      <!-- Independent 3-Language Switcher + Scroll-Reveal Toggle -->
      <div class="flex items-center gap-2 flex-wrap">
        <button id="btnRevealToggle" onclick="toggleRevealAll()" class="px-2.5 py-1 rounded-lg bg-white border border-[#E7E2D8] text-[11px] font-bold text-[#2A6F5B] hover:bg-[#F4F9F7] transition"></button>
        <div class="flex rounded-lg bg-[#F1EDE4] p-0.5 border border-[#E7E2D8]" role="group" aria-label="Language Edition">
          <button id="btnLangZh" onclick="setLanguage('zh')" class="px-2.5 py-1 rounded-md text-xs font-bold bg-[#1F2421] text-white transition">中文 (标准)</button>
          <button id="btnLangEn" onclick="setLanguage('en')" class="px-2.5 py-1 rounded-md text-xs font-bold text-[#575D59] hover:text-[#1F2421] transition">English</button>
          <button id="btnLangVi" onclick="setLanguage('vi')" class="px-2.5 py-1 rounded-md text-xs font-bold text-[#575D59] hover:text-[#1F2421] transition">Tiếng Việt</button>
        </div>
      </div>
    </div>

    <!-- Mobile Horizontal Scroll Nav -->
    <div class="xl:hidden border-t border-[#E7E2D8] bg-[#FAF8F5] px-4 py-1.5 overflow-x-auto flex items-center gap-1.5">
      <button onclick="jumpToSection('sec-model')" class="nav-btn nav-pill-active whitespace-nowrap px-2.5 py-1 rounded-lg text-[11px] font-bold" data-target="sec-model" id="mNavBtn1"></button>
      <button onclick="jumpToSection('sec-parents-harvard')" class="nav-btn whitespace-nowrap px-2.5 py-1 rounded-lg text-[11px] font-semibold text-[#575D59]" data-target="sec-parents-harvard" id="mNavBtn2"></button>
      <button onclick="jumpToSection('sec-generations')" class="nav-btn whitespace-nowrap px-2.5 py-1 rounded-lg text-[11px] font-semibold text-[#575D59]" data-target="sec-generations" id="mNavBtn3"></button>
      <button onclick="jumpToSection('sec-empirical')" class="nav-btn whitespace-nowrap px-2.5 py-1 rounded-lg text-[11px] font-semibold text-[#575D59]" data-target="sec-empirical" id="mNavBtn4"></button>
      <button onclick="jumpToSection('sec-examples')" class="nav-btn whitespace-nowrap px-2.5 py-1 rounded-lg text-[11px] font-semibold text-[#575D59]" data-target="sec-examples" id="mNavBtn5"></button>
      <button onclick="jumpToSection('sec-protocol')" class="nav-btn whitespace-nowrap px-2.5 py-1 rounded-lg text-[11px] font-semibold text-[#575D59]" data-target="sec-protocol" id="mNavBtn6"></button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-14 sm:space-y-20">

    <!-- HERO SECTION (Visible on Load) -->
    <section id="sec-hero" class="scroll-reveal is-revealed card-elevated rounded-2xl p-5 sm:p-8 lg:p-10 relative overflow-hidden">
      <div class="max-w-4xl">
        <div class="inline-flex flex-wrap items-center gap-2 px-3 py-1 rounded-full bg-[#F4F9F7] border border-[#CBE3DC] text-[#2A6F5B] text-xs font-bold mb-4">
          <span>◈</span>
          <span id="heroBadge"></span>
        </div>
        <h2 id="heroTitle" class="text-xl sm:text-3xl lg:text-4xl font-extrabold text-[#1F2421] tracking-tight leading-snug mb-4"></h2>
        <p id="heroDesc" class="text-sm sm:text-base text-[#575D59] leading-relaxed mb-6"></p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pt-2" id="heroKpiGrid"></div>

      <div id="heroScrollPrompt" class="mt-6 pt-4 border-t border-[#E7E2D8] flex flex-wrap items-center justify-between gap-2 text-xs font-semibold text-[#2A6F5B]"></div>
    </section>

    <!-- SECTION 1: 4-FACTOR CONVERGENCE MODEL (SPACEBAR 4-STEP REVEAL, ZERO TEXT OVERLAP) -->
    <section id="sec-model" class="scroll-reveal space-y-6 scroll-mt-24">
      <div class="max-w-4xl">
        <span id="sec1Tag" class="text-xs font-bold uppercase tracking-wider text-[#2A6F5B]"></span>
        <h2 id="sec1Title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-[#1F2421] mt-1"></h2>
        <p id="sec1Intro" class="text-xs sm:text-sm text-[#575D59] mt-2 leading-relaxed"></p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <div class="lg:col-span-5 lg:sticky lg:top-24 card-elevated rounded-2xl p-4 sm:p-5 flex flex-col items-center overflow-hidden">
          <div class="w-full flex flex-wrap items-center justify-between gap-2 mb-3">
            <span onclick="advanceSpaceStep()" class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-extrabold bg-[#2A6F5B] text-white space-key-badge cursor-pointer">
              ⌨️ SPACE (<span id="canvasStepCounter" class="font-mono-num ml-1">1/4</span>)
            </span>
            <div class="flex rounded-lg bg-[#F1EDE4] p-0.5 border border-[#E7E2D8] text-[11px] font-bold">
              <button id="btnGeoOrbital" onclick="setDiagramGeometry('orbital')" class="px-2 py-1 rounded-md bg-[#1F2421] text-white transition"></button>
              <button id="btnGeoConcentric" onclick="setDiagramGeometry('concentric')" class="px-2 py-1 rounded-md text-[#575D59] hover:text-[#1F2421] transition"></button>
            </div>
          </div>

          <div class="diagram-stage-shell" id="diagramShell">
            <canvas id="fourFactorCanvas"></canvas>
          </div>

          <div class="w-full grid grid-cols-2 sm:grid-cols-4 gap-1.5 mt-3" id="stepButtonsRow"></div>

          <div class="w-full flex items-center justify-between gap-2 mt-3 pt-2.5 border-t border-[#E7E2D8] text-xs">
            <button id="btnResetSteps" onclick="resetInteractiveSteps()" class="font-semibold text-[#575D59] hover:text-[#1F2421] transition"></button>
            <button id="btnNextStepInline" onclick="advanceSpaceStep()" class="font-bold text-[#2A6F5B] hover:underline"></button>
          </div>
        </div>

        <div class="lg:col-span-7 space-y-4 min-w-0">
          <div class="card-elevated rounded-xl p-3.5 bg-[#F4F9F7] border-[#CBE3DC] flex flex-wrap items-center justify-between gap-2">
            <span class="text-xs font-extrabold text-[#2A6F5B]" id="stepStatusBanner"></span>
            <button id="btnUnlockAllSteps" onclick="setInteractiveStep(4, true)" class="px-3 py-1.5 rounded-lg bg-[#2A6F5B] text-white text-xs font-bold hover:bg-[#225B4A] transition shrink-0"></button>
          </div>

          <div id="progressiveExplanationStack" class="space-y-4"></div>

          <div id="coreDistinctionCard" class="card-elevated rounded-2xl p-5 bg-[#FAF8F5]"></div>
        </div>
      </div>
    </section>

    <!-- SECTION 2: 8x-9x PARENTS' 5 WEAKNESSES & HARVARD 85-YEAR STUDY -->
    <section id="sec-parents-harvard" class="scroll-reveal space-y-6 scroll-mt-24">
      <div class="max-w-4xl">
        <span id="sec2Tag" class="text-xs font-bold uppercase tracking-wider text-[#C44D3B]"></span>
        <h2 id="sec2Title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-[#1F2421] mt-1"></h2>
        <p id="sec2Intro" class="text-xs sm:text-sm text-[#575D59] mt-2 leading-relaxed"></p>
      </div>

      <div class="card-elevated rounded-2xl p-5 sm:p-6">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
          <h3 id="weaknessBoxTitle" class="text-base sm:text-lg font-extrabold text-[#1F2421]"></h3>
          <span id="weaknessBoxHint" class="text-xs font-semibold text-[#C44D3B]"></span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2 mb-5" id="weaknessTabs"></div>
        <div id="weaknessDetailBox"></div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-6 card-elevated rounded-2xl p-5 sm:p-6 flex flex-col justify-between">
          <div>
            <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#FDF4E7] border border-[#F0DEC2] text-[#9E5E1E] text-[11px] font-bold mb-2">
              <span>🏛️</span>
              <span id="harvardBadge"></span>
            </div>
            <h3 id="harvardChartTitle" class="text-sm sm:text-base font-extrabold text-[#1F2421]"></h3>
            <p id="harvardChartSub" class="text-xs text-[#575D59] mb-4"></p>
            <div class="chart-container">
              <canvas id="harvardStudyChart"></canvas>
            </div>
          </div>
          <div id="harvardCalloutBox" class="mt-4 p-3.5 rounded-xl bg-[#F4F9F7] border border-[#CBE3DC] text-xs text-[#1F2421] leading-relaxed"></div>
        </div>

        <div class="lg:col-span-6 card-elevated rounded-2xl p-5 sm:p-6 flex flex-col justify-between">
          <div>
            <h3 id="easySolTitle" class="text-sm sm:text-base font-extrabold text-[#2A6F5B]"></h3>
            <p id="easySolSub" class="text-xs text-[#575D59] mb-4"></p>
            <div class="space-y-3" id="easySolutionsList"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- SECTION 3: 106-YEAR INTERGENERATIONAL TRAJECTORY & 5 ARCHETYPES -->
    <section id="sec-generations" class="scroll-reveal space-y-6 scroll-mt-24">
      <div class="max-w-4xl">
        <span id="sec3Tag" class="text-xs font-bold uppercase tracking-wider text-[#2A6F5B]"></span>
        <h2 id="sec3Title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-[#1F2421] mt-1"></h2>
        <p id="sec3Intro" class="text-xs sm:text-sm text-[#575D59] mt-2 leading-relaxed"></p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-7 card-elevated rounded-2xl p-5 sm:p-6 flex flex-col justify-between">
          <div>
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div>
                <h3 id="genChartTitle" class="text-sm sm:text-base font-extrabold text-[#1F2421]"></h3>
                <p id="genChartSub" class="text-xs text-[#575D59]"></p>
              </div>
              <div class="flex gap-1.5">
                <button onclick="setGenChartMode('all')" id="btnGenAll" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#2A6F5B] text-white transition"></button>
                <button onclick="setGenChartMode('risk')" id="btnGenRisk" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#F1EDE4] text-[#575D59] transition"></button>
              </div>
            </div>
            <div class="chart-container">
              <canvas id="generationalChart"></canvas>
            </div>
          </div>
          <div class="mt-4 pt-3 border-t border-[#E7E2D8] grid grid-cols-2 sm:grid-cols-4 gap-2 text-center" id="genSummaryStrip"></div>
        </div>

        <div class="lg:col-span-5 card-elevated rounded-2xl p-5 sm:p-6 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-3">
              <h3 id="scenarioBoxTitle" class="text-sm sm:text-base font-extrabold text-[#1F2421]"></h3>
              <span id="scenarioHint" class="text-[11px] font-bold text-[#C87D32]"></span>
            </div>
            <div class="space-y-2" id="scenarioList"></div>
          </div>
          <div id="scenarioDetailBox" class="mt-4 p-4 rounded-xl border"></div>
        </div>
      </div>
    </section>

    <!-- SECTION 4: EMPIRICAL LABORATORY -->
    <section id="sec-empirical" class="scroll-reveal space-y-6 scroll-mt-24">
      <div class="max-w-4xl">
        <span id="sec4Tag" class="text-xs font-bold uppercase tracking-wider text-[#2A6F5B]"></span>
        <h2 id="sec4Title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-[#1F2421] mt-1"></h2>
        <p id="sec4Intro" class="text-xs sm:text-sm text-[#575D59] mt-2 leading-relaxed"></p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="card-elevated rounded-2xl p-5 sm:p-6">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div>
              <h3 id="riskChartTitle" class="text-sm sm:text-base font-extrabold text-[#1F2421]"></h3>
              <p id="riskChartSub" class="text-xs text-[#575D59]"></p>
            </div>
            <select id="cohortFilterSelect" onchange="updateRiskChart()" class="text-xs font-bold bg-[#FAF8F5] border border-[#E7E2D8] rounded-lg px-2.5 py-1.5 text-[#1F2421]"></select>
          </div>
          <div class="chart-container">
            <canvas id="failureRiskChart"></canvas>
          </div>
          <div id="riskChartCallout" class="mt-3 p-3.5 rounded-xl bg-[#FDF6F5] border border-[#F2D3CE] text-xs text-[#1F2421] leading-relaxed"></div>
        </div>

        <div class="card-elevated rounded-2xl p-5 sm:p-6">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div>
              <h3 id="profileChartTitle" class="text-sm sm:text-base font-extrabold text-[#1F2421]"></h3>
              <p id="profileChartSub" class="text-xs text-[#575D59]"></p>
            </div>
            <select id="profileCompareSelect" onchange="updateProfileChart()" class="text-xs font-bold bg-[#FAF8F5] border border-[#E7E2D8] rounded-lg px-2.5 py-1.5 text-[#1F2421]"></select>
          </div>
          <div class="chart-container">
            <canvas id="psychometricProfileChart"></canvas>
          </div>
          <div id="starmansNoteBox" class="mt-3 p-3.5 rounded-xl bg-[#F4F9F7] border border-[#CBE3DC] text-xs text-[#1F2421] leading-relaxed"></div>
        </div>
      </div>

      <div class="card-elevated rounded-2xl p-5 sm:p-6">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div>
            <h3 id="tableTitle" class="text-sm sm:text-base font-extrabold text-[#1F2421]"></h3>
            <p id="tableSub" class="text-xs text-[#575D59]"></p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <input type="text" id="tableSearchInput" onkeyup="renderStatsTable()" class="text-xs px-3 py-1.5 rounded-lg border border-[#E7E2D8] bg-[#FAF8F5] focus:outline-none focus:border-[#2A6F5B]" />
            <button onclick="toggleTableSort()" id="btnSortTable" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-[#F1EDE4] text-[#1F2421] hover:bg-[#E7E2D8] transition"></button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr id="statsTableHeadRow" class="border-b-2 border-[#E7E2D8] bg-[#FAF8F5] text-[#1F2421] font-bold"></tr>
            </thead>
            <tbody id="statsTableBody" class="divide-y divide-[#E7E2D8]"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- SECTION 5: 4 VERBAL FALLACIES & 5 REAL-WORLD SCENARIOS -->
    <section id="sec-examples" class="scroll-reveal space-y-6 scroll-mt-24">
      <div class="max-w-4xl">
        <span id="sec5Tag" class="text-xs font-bold uppercase tracking-wider text-[#C44D3B]"></span>
        <h2 id="sec5Title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-[#1F2421] mt-1"></h2>
        <p id="sec5Intro" class="text-xs sm:text-sm text-[#575D59] mt-2 leading-relaxed"></p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="fallacyGrid"></div>

      <div class="card-elevated rounded-2xl p-5 sm:p-6">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
          <div>
            <h3 id="examplesHeader" class="text-base sm:text-lg font-extrabold text-[#1F2421]"></h3>
            <p id="examplesSub" class="text-xs text-[#575D59]"></p>
          </div>

    function wrapTextLines(str, maxLen = 16) {
      if (str.length <= maxLen) return [str];
      const words = str.split(' ');
      if (words.length === 1) return [str];
      const lines = [];
      let cur = '';
      words.forEach((w) => {
        if ((cur + ' ' + w).trim().length <= maxLen) cur = (cur + ' ' + w).trim();
        else { if (cur) lines.push(cur); cur = w; }
      });
      if (cur) lines.push(cur);
      return lines;
    }

    let hitTargets = [];

    function setDiagramGeometry(geo) {
      appState.diagramGeometry = geo;

    function drawFourFactorCanvas() {
      const canvas = document.getElementById('fourFactorCanvas');
      const shell = document.getElementById('diagramShell');
      if (!canvas || !shell) return;

      const rect = shell.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = Math.max(260, Math.floor(rect.width));
      const h = Math.max(260, Math.floor(rect.height));

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      hitTargets = [];
      const cx = w / 2;
      const cy = h / 2;
      const step = appState.currentStep;
      const nodes = MODEL_NODES[appState.lang];

      if (appState.diagramGeometry === 'orbital') {
        const rBase = Math.min(w, h) * 0.44;
        const rOrbit = rBase * 0.66;
        const rOuter = rBase * 0.31;
        const rCore = rBase * 0.26;

        ctx.beginPath();
        ctx.arc(cx, cy, rOrbit, 0, Math.PI * 2);
        ctx.strokeStyle = '#E0D9CD';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        const angles = [-Math.PI / 2, Math.PI / 6, (5 * Math.PI) / 6];
        const outerPos = angles.map((ang, i) => ({
          stepNum: i + 1,
          x: cx + rOrbit * Math.cos(ang),
          y: cy + rOrbit * Math.sin(ang),
          r: rOuter
        }));

        if (step >= 4) {
          outerPos.forEach((p) => {
            const dx = cx - p.x;
            const dy = cy - p.y;
            const dist = Math.hypot(dx, dy);
            const ux = dx / dist;
            const uy = dy / dist;
            const sx = p.x + ux * (rOuter + 2);
            const sy = p.y + uy * (rOuter + 2);
            const ex = cx - ux * (rCore + 4);
            const ey = cy - uy * (rCore + 4);

            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(ex, ey);
            ctx.strokeStyle = '#C87D32';
            ctx.lineWidth = 2.2;
            ctx.stroke();

            const head = 6;
            const a = Math.atan2(ey - sy, ex - sx);
            ctx.beginPath();
            ctx.moveTo(ex, ey);
            ctx.lineTo(ex - head * Math.cos(a - Math.PI / 6), ey - head * Math.sin(a - Math.PI / 6));
            ctx.lineTo(ex - head * Math.cos(a + Math.PI / 6), ey - head * Math.sin(a + Math.PI / 6));
            ctx.closePath();
            ctx.fillStyle = '#C87D32';
            ctx.fill();
          });
        }

        outerPos.forEach((p, idx) => {
          const n = nodes[idx];
          const revealed = step >= p.stepNum;
          const active = step === p.stepNum;
          hitTargets.push({ stepNum: p.stepNum, x: p.x, y: p.y, r: p.r });

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);

          if (revealed) {
            ctx.fillStyle = active ? '#E6F3EE' : '#FFFFFF';
            ctx.fill();
            ctx.lineWidth = active ? 3.5 : 2.2;
            ctx.strokeStyle = '#2A6F5B';
            ctx.stroke();

            const fs = Math.max(9, Math.min(12.5, Math.floor(p.r * 0.21)));
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const lines = n.canvasLines;
            const maxW = p.r * 1.72;
            if (lines.length === 2) {
              ctx.fillStyle = '#1F2421';
              ctx.font = `800 ${fs}px "Noto Sans SC", "Be Vietnam Pro", sans-serif`;
              ctx.fillText(lines[0], p.x, p.y - fs * 0.65, maxW);
              ctx.fillStyle = '#2A6F5B';
              ctx.font = `700 ${Math.max(8, fs - 1.5)}px "JetBrains Mono", "Noto Sans SC", sans-serif`;
              ctx.fillText(lines[1], p.x, p.y + fs * 0.72, maxW);
            }
          } else {
            ctx.fillStyle = 'rgba(241, 237, 228, 0.5)';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#C8C1B4';
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#9A9488';
            ctx.font = '700 10px "JetBrains Mono", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`Space #${p.stepNum}`, p.x, p.y, p.r * 1.6);
          }
        });

        hitTargets.push({ stepNum: 4, x: cx, y: cy, r: rCore });
        if (step >= 4) {
          ctx.beginPath();
          ctx.arc(cx, cy, rCore, 0, Math.PI * 2);
          ctx.fillStyle = '#C87D32';
          ctx.fill();
          ctx.lineWidth = 3.5;
          ctx.strokeStyle = '#FFF4E4';
          ctx.stroke();

          const coreNode = nodes[3];
          const cfs = Math.max(9, Math.min(12, Math.floor(rCore * 0.22)));
          const maxCW = rCore * 1.72;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#FFFFFF';
          ctx.font = `800 ${cfs}px "Noto Sans SC", "Be Vietnam Pro", sans-serif`;
          ctx.fillText(coreNode.canvasLines[0], cx, cy - cfs * 0.65, maxCW);
          ctx.fillStyle = '#FFE5B4';
          ctx.font = `700 ${Math.max(8, cfs - 1.5)}px "JetBrains Mono", "Noto Sans SC", sans-serif`;
          ctx.fillText(coreNode.canvasLines[1], cx, cy + cfs * 0.72, maxCW);
        } else {
          ctx.beginPath();
          ctx.arc(cx, cy, rCore * 0.76, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(253, 244, 231, 0.55)';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.setLineDash([3, 3]);
          ctx.strokeStyle = '#DFC39D';
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = '#B07D45';
          ctx.font = '700 9.5px "JetBrains Mono", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('Space #4', cx, cy, rCore * 1.3);
        }
      } else {
        const maxR = Math.min(w, h) * 0.45;
        const rings = [
          { stepNum: 1, r: maxR, fill: '#E8F2EE', active: '#2A6F5B', stroke: '#2A6F5B' },
          { stepNum: 2, r: maxR * 0.76, fill: '#D5E8E1', active: '#36826C', stroke: '#2A6F5B' },
          { stepNum: 3, r: maxR * 0.52, fill: '#C2DDD4', active: '#44967E', stroke: '#2A6F5B' },
          { stepNum: 4, r: maxR * 0.28, fill: '#C87D32', active: '#C87D32', stroke: '#C87D32' }
        ];

        rings.forEach((rg, idx) => {
          const revealed = step >= rg.stepNum;
          const isFocus = step === rg.stepNum;
          const n = nodes[idx];
          hitTargets.push({ stepNum: rg.stepNum, x: cx, y: cy, r: rg.r, concentric: true });

          ctx.beginPath();
          ctx.arc(cx, cy, rg.r, 0, Math.PI * 2);
          if (!revealed) {
            ctx.fillStyle = '#F7F5F0';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#D0C9BD';
            ctx.stroke();
            ctx.setLineDash([]);
            return;
          }

          ctx.fillStyle = rg.stepNum === 4 ? '#C87D32' : (isFocus ? rg.active : rg.fill);
          ctx.fill();
          ctx.lineWidth = isFocus ? 3 : 2;
          ctx.strokeStyle = rg.stroke;
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          if (idx < 3) {
            const nextR = rings[idx + 1].r;
            const bandMid = (rg.r + nextR) / 2;
            ctx.fillStyle = isFocus ? '#FFFFFF' : '#1F2421';
            ctx.font = '800 10.5px "Noto Sans SC", "Be Vietnam Pro", sans-serif';
            ctx.fillText(`${n.canvasLines[0]} (${n.canvasLines[1]})`, cx, cy - bandMid, rg.r * 1.4);
          } else {
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '800 10.5px "Noto Sans SC", "Be Vietnam Pro", sans-serif';
            ctx.fillText(n.canvasLines[0], cx, cy - 6, rg.r * 1.7);
            ctx.fillStyle = '#FFE5B4';
            ctx.font = '700 9px "JetBrains Mono", sans-serif';
            ctx.fillText(n.canvasLines[1], cx, cy + 8, rg.r * 1.7);
          }
        });
      }
    }

    function setInteractiveStep(stepNum, scrollToNew = false) {
      appState.currentStep = Math.max(1, Math.min(4, stepNum));
      const s = appState.currentStep;
      const t = UI_TEXT[appState.lang];
      const nodes = MODEL_NODES[appState.lang];

      document.getElementById('canvasStepCounter').textContent = `${s}/4`;
      document.getElementById('floatingStepCount').textContent = `${s}/4`;
      document.getElementById('stepStatusBanner').textContent = t.stepBanners[s];
      document.getElementById('floatingBarText').textContent = t.floatBanners[s];

      document.getElementById('stepButtonsRow').innerHTML = nodes.map((n) => {
        const unlocked = n.step <= s;
        const current = n.step === s;
        let cls = 'py-2 px-1.5 rounded-lg text-[11px] font-bold border transition text-center leading-tight ';
        if (n.step === 4) {
          cls += current ? 'border-[#C87D32] bg-[#C87D32] text-white shadow-sm' : 'border-[#C87D32] bg-[#FDF4E7] text-[#C87D32] hover:bg-[#C87D32] hover:text-white';
        } else if (current) {
          cls += 'border-[#2A6F5B] bg-[#2A6F5B] text-white shadow-sm';
        } else if (unlocked) {
          cls += 'border-[#2A6F5B] bg-[#F4F9F7] text-[#2A6F5B]';
        } else {
          cls += 'border-[#E7E2D8] bg-[#FAF8F5] text-[#575D59] hover:border-[#2A6F5B]';
        }
        return `<button onclick="setInteractiveStep(${n.step}, true)" class="${cls}"><div>${n.btnTop}</div><div class="text-[9.5px] opacity-85 font-normal mt-0.5">${n.btnSub}</div></button>`;
      }).join('');

      drawFourFactorCanvas();
      renderProgressiveExplanations(scrollToNew);
    }

    function runSimulator() {
      const wake = Number(document.getElementById('sliderWake').value);
      const sched = Number(document.getElementById('sliderSchedule').value);
      const asset = Number(document.getElementById('sliderAsset').value);
      const chore = Number(document.getElementById('sliderChore').value);
      const exp = Number(document.getElementById('sliderExp').value);
      const warmth = Number(document.getElementById('sliderWarmth').value);

      document.getElementById('valWake').textContent = wake + '%';
      document.getElementById('valSchedule').textContent = sched + '%';
      document.getElementById('valAsset').textContent = asset + '%';
      document.getElementById('valChore').textContent = chore + '%';
      document.getElementById('valExp').textContent = exp + '%';
      document.getElementById('valWarmth').textContent = warmth + '%';

      const apoi = (wake * 0.20 + sched * 0.20 + asset * 0.25 + chore * 0.20 + exp * 0.15);
      const risk = 41.2 - (apoi / 100) * (41.2 - 14.2);
      const diff = risk - 14.2;

      const apoiEl = document.getElementById('simApoiScore');
      const riskEl = document.getElementById('simRiskScore');
      const relEl = document.getElementById('simRelScore');
      const box = document.getElementById('simVerdictBox');

      apoiEl.textContent = apoi.toFixed(1);
      riskEl.textContent = risk.toFixed(1) + '%';
      relEl.textContent = warmth + '%';
      relEl.className = `font-mono-num text-lg sm:text-xl font-extrabold mt-0.5 ${warmth >= 70 ? 'text-[#2A6F5B]' : warmth >= 45 ? 'text-[#C87D32]' : 'text-[#C44D3B]'}`;

      const l = appState.lang;
      const dStr = diff.toFixed(1);
      const warmthWarn = warmth < 50 ? {
        zh: ' 此外，父母情绪稳定度偏低（哈佛温暖缓冲不足），建议先暂停深呼吸稳住情绪并停止攀比诉苦。',
        en: ' Additionally, low parental emotional stability (<50%) weakens the Harvard relational buffer—pause before reacting and stop social comparison.',
        vi: ' Ngoài ra, độ ổn định cảm xúc của cha mẹ đang thấp (<50% đệm Harvard), hãy tạm dừng hít thở trước khi phản ứng và ngưng so bì/kể lể.'
      }[l] : {
        zh: ' 父母情绪温暖度良好，为孩子提供了稳定的哈佛安全关系缓冲垫。',
        en: ' Parental emotional warmth is providing a protective Harvard relational safety buffer.',
        vi: ' Cảm xúc ấm áp của cha mẹ đang tạo vùng đệm an toàn quan hệ theo chuẩn Harvard.'
      }[l];

      if (diff >= 20) {
        apoiEl.className = riskEl.className = 'font-mono-num text-lg sm:text-xl font-extrabold text-[#C44D3B] mt-0.5';
        box.className = 'p-3.5 rounded-xl bg-[#FDF6F5] border border-[#F2D3CE] text-xs text-[#1F2421] leading-relaxed';
        box.innerHTML = {
          zh: `<strong class="text-[#C44D3B]">⚠️ 越过 +20% 风险警报线 (+${dStr}% vs 基准)：</strong> 孩子深陷“所有权真空区”。请即刻执行：物品100%清晰确权、允许迟到/晚交1–2天不催促、父母战略性示弱。${warmthWarn}`,
          en: `<strong class="text-[#C44D3B]">⚠️ Exceeds +20% Alert Threshold (+${dStr}% vs. Baseline):</strong> Child is trapped in the Ownership Dead Zone. Apply 100% ownership certainty, 1–2 day unprompted delays, and strategic playing dumb immediately.${warmthWarn}`,
          vi: `<strong class="text-[#C44D3B]">⚠️ Vượt ngưỡng +20% (+${dStr}% vs Chuẩn):</strong> Trẻ đang ở Vùng trũng Vô chủ. Hãy áp dụng ngay: Nói đồ của con chắc chắn 100%, cho trễ 1–2 ngày không nhắc và ba mẹ giả ngốc/lo lắng.${warmthWarn}`
        }[l];
      } else if (diff >= 8) {
        apoiEl.className = riskEl.className = 'font-mono-num text-lg sm:text-xl font-extrabold text-[#C87D32] mt-0.5';
        box.className = 'p-3.5 rounded-xl bg-[#FDF4E7] border border-[#F0DEC2] text-xs text-[#1F2421] leading-relaxed';
        box.innerHTML = {
          zh: `<strong class="text-[#C87D32]">◈ 过渡改善区 (+${dStr}% vs 基准)：</strong> 孩子已有初步自驱力，但父母仍存在早早代劳或偶尔催促。坚持完整放手1–2天并增加示弱请教。${warmthWarn}`,
          en: `<strong class="text-[#C87D32]">◈ Transitional Zone (+${dStr}% vs. Baseline):</strong> Autonomy is emerging, yet occasional rescuing remains. Hold back a full 1–2 days without prompting.${warmthWarn}`,
          vi: `<strong class="text-[#C87D32]">◈ Vùng chuyển tiếp (+${dStr}% vs Chuẩn):</strong> Trẻ đã bước đầu tự giác nhưng cha mẹ vẫn còn sốt ruột làm thay. Kiên nhẫn cho trễ đủ 1–2 ngày không nhắc và giả ngốc nhiều hơn.${warmthWarn}`
        }[l];
      } else {
        apoiEl.className = riskEl.className = 'font-mono-num text-lg sm:text-xl font-extrabold text-[#2A6F5B] mt-0.5';
        box.className = 'p-3.5 rounded-xl bg-[#F4F9F7] border border-[#CBE3DC] text-xs text-[#1F2421] leading-relaxed';
        box.innerHTML = {
          zh: `<strong class="text-[#2A6F5B]">✓ 自主稳健安全区 (+${dStr}% vs 基准)：</strong> 外围三环稳固向“100%所有权核心”聚拢，责任、耐挫与主动性已全面激活。${warmthWarn}`,
          en: `<strong class="text-[#2A6F5B]">✓ Autonomous Safe Zone (+${dStr}% vs. Baseline):</strong> All 3 outer pillars converge robustly on 100% Ownership, cultivating resilient self-regulation.${warmthWarn}`,
          vi: `<strong class="text-[#2A6F5B]">✓ Vùng an toàn tự chủ (+${dStr}% vs Chuẩn):</strong> Cả 3 vòng tròn ngoài đang hội tụ vững chắc về Tâm điểm Sở hữu 100%, giúp con tự giác bền vững.${warmthWarn}`
        }[l];
      }
    }

    let revealObserver = null;

    function initScrollReveal() {
      const sections = document.querySelectorAll('.scroll-reveal');
      if (!('IntersectionObserver' in window)) {
        sections.forEach((s) => s.classList.add('is-revealed'));
        return;
      }
      revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-revealed');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.06, rootMargin: '0px 0px -30px 0px' });

      sections.forEach((sec) => {
        if (sec.id !== 'sec-hero') revealObserver.observe(sec);
      });
    }

    function toggleRevealAll() {
      appState.revealAll = !appState.revealAll;
      if (appState.revealAll) {
        document.body.classList.add('reveal-disabled');
        document.querySelectorAll('.scroll-reveal').forEach((s) => s.classList.add('is-revealed'));
      } else {
        document.body.classList.remove('reveal-disabled');
      }
      const t = UI_TEXT[appState.lang];
      document.getElementById('btnRevealToggle').textContent = appState.revealAll ? t.revealOff : t.revealOn;
    }

    function jumpToSection(id) {
      const target = document.getElementById(id);
      if (target) {
        target.classList.add('is-revealed');
        target.scrollIntoView({ behavior: 'smooth' });
      }
      document.querySelectorAll('.nav-btn').forEach((b) => {
        if (b.dataset.target === id) b.classList.add('nav-pill-active');
        else b.classList.remove('nav-pill-active');
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      window.addEventListener('keydown', (e) => {
        const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea' || tag === 'select' || tag === 'button') {
          if (tag !== 'button' || e.code !== 'Space') return;
        }
        if (e.code === 'Space' || e.key === ' ') {
          e.preventDefault();
          advanceSpaceStep();
        }
      });

      const canvas = document.getElementById('fourFactorCanvas');
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        if (appState.diagramGeometry === 'orbital') {
          for (let i = 0; i < hitTargets.length; i++) {
            if (Math.hypot(x - hitTargets[i].x, y - hitTargets[i].y) <= hitTargets[i].r) {
              setInteractiveStep(hitTargets[i].stepNum, true);
              return;
            }
          }
          advanceSpaceStep();
        } else {
          const sorted = [...hitTargets].sort((a, b) => a.r - b.r);
          for (let i = 0; i < sorted.length; i++) {
            if (Math.hypot(x - sorted[i].x, y - sorted[i].y) <= sorted[i].r) {
              setInteractiveStep(sorted[i].stepNum, true);
              return;
            }
          }
        }
      });

      const shell = document.getElementById('diagramShell');
      if (window.ResizeObserver && shell) {
        new ResizeObserver(() => drawFourFactorCanvas()).observe(shell);
      } else {
        window.addEventListener('resize', drawFourFactorCanvas);
      }

      initHarvardChart();
      initGenerationalChart();
      initRiskChart();
      initProfileChart();
      setLanguage('zh');
      initScrollReveal();
    });
  </script>
</body>
</html>
